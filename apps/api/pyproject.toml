[project]
name = "tiqr-api"
version = "1.1.0"
description = "TiQR HTTP API over the core service, hosting the bundled web app"
requires-python = ">=3.14"
dependencies = [
    "tiqr-core",
    "fastapi>=0.143.2",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tiqr.api"

[tool.uv.sources]
tiqr-core = { workspace = true }
