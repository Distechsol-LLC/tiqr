[project]
name = "tiqr-core"
version = "0.9.4"
description = "TiQR core: tickets, storage, BioStar X integration, QR and PDF output"
requires-python = ">=3.14"
dependencies = [
    "httpx2>=2.13.1",
    "qrcode>=8.2",
    "reportlab>=4.4",
    "argon2-cffi>=25.1",
    "tzdata>=2025.2",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tiqr.core"
