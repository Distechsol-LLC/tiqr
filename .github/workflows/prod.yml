name: Prod

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    # Only after CI passes on a push whose commit message carries [PROD].
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      contains(github.event.workflow_run.head_commit.message, '[PROD]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history, so the ancestry check below can see how prod and this commit relate.
          fetch-depth: 0
      - name: Point prod at the release commit
        run: |
          git fetch --no-tags origin prod
          # Runs can finish out of order; an older release must not move prod backwards.
          if git merge-base --is-ancestor origin/prod HEAD; then
            git push origin "HEAD:refs/heads/prod"
          else
            echo "::warning::prod is not an ancestor of $(git rev-parse --short HEAD); leaving prod unchanged"
          fi
      # Pushes made with GITHUB_TOKEN don't start workflows, so the build is dispatched explicitly.
      - name: Build the executables on prod
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run executables.yml --ref prod
