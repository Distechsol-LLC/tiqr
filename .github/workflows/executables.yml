name: Executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - name: Build the web app into the api package
        shell: bash
        working-directory: apps/web
        run: |
          bun install --frozen-lockfile
          bun bundle
          # The api serves this folder as package data, so PyInstaller bundles it.
          rm -rf ../api/src/tiqr/api/web
          cp -r build ../api/src/tiqr/api/web
      - run: uv run pyinstaller packaging/tiqr.spec --noconfirm
      - name: Smoke test the executable from a fresh folder
        shell: bash
        run: |
          smoke="$RUNNER_TEMP/smoke"
          mkdir "$smoke"
          cp dist/tiqr* "$smoke/"
          # Named explicitly: once setup creates tiqr.db, a tiqr* glob would match it too.
          exe=$(basename dist/tiqr*)
          cd "$smoke"
          ./"$exe" --help > /dev/null
          ./"$exe" user list
          test -f .env.local
          # getpass ignores piped input on Windows, so only the POSIX runners script a password.
          if [ "$RUNNER_OS" != "Windows" ]; then
            printf 'smoke-password\nsmoke-password\n' | ./"$exe" user add root --role admin > /dev/null
            printf 'smoke-password\n' | ./"$exe" ticket create --as root -n "Smoke Visitor" -t Visitor -f 2030-01-01T08:00 -u 2030-01-01T18:00 --usage one_time --tz Asia/Baku > ticket.json
            id=$(sed -n 's/^ *"id": "\(.*\)",\{0,1\}$/\1/p' ticket.json | head -1)
            printf 'smoke-password\n' | ./"$exe" ticket save "$id" --as root
            test -s out/*.pdf
            head -c 4 out/*.pdf | grep -q '%PDF'
            # The server, as installs run it: up, healthy, and signing in the admin above.
            ./"$exe" serve --dev --port 8765 > serve.log 2>&1 &
            server=$!
            for _ in $(seq 1 60); do
              curl -sf http://127.0.0.1:8765/api/health > /dev/null && break
              sleep 0.5
            done
            curl -sf http://127.0.0.1:8765/api/health | grep -q '"status":"ok"' || { cat serve.log; exit 1; }
            curl -sf -H 'Content-Type: application/json' -d '{"username":"root","password":"smoke-password"}' \
              http://127.0.0.1:8765/api/auth/login | grep -q csrf_token || { cat serve.log; exit 1; }
            kill "$server"
          fi
      - name: Name the executable after its platform
        shell: bash
        run: |
          mkdir release
          exe=$(basename dist/tiqr*)
          # Keeps the three platforms' files apart once they are merged into one folder.
          cp "dist/$exe" "release/tiqr-$RUNNER_OS-$RUNNER_ARCH${exe#tiqr}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/prod'
        with:
          name: tiqr-${{ runner.os }}-${{ runner.arch }}
          path: release/*
          retention-days: 7

  release:
    # Tags only; builds from other refs, such as prod, don't publish a release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tiqr-*
          path: release
          merge-multiple: true
      - name: Check the tag matches the package version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Publish the executables with checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release && sha256sum tiqr-* > SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
          fi
