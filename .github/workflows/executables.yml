name: Executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - name: Build the web app into the api package
        shell: bash
        working-directory: apps/web
        run: |
          bun install --frozen-lockfile
          bun bundle
          # The api serves this folder as package data, so PyInstaller bundles it.
          rm -rf ../api/src/tiqr/api/web
          cp -r build ../api/src/tiqr/api/web
      - run: uv run pyinstaller packaging/tiqr.spec --noconfirm
      - name: Smoke test the executable from a fresh folder
        shell: bash
        run: |
          smoke="$RUNNER_TEMP/smoke"
          mkdir "$smoke"
          cp dist/tiqr* "$smoke/"
          # The executable refuses to run without its branding file beside it.
          cp tiqr_brand.jsonc "$smoke/"
          # Named explicitly: once setup creates tiqr.db, a tiqr* glob would match it too.
          exe=$(basename dist/tiqr*)
          cd "$smoke"
          ./"$exe" --help > /dev/null
          ./"$exe" user list
          test -f .env.local
          # Renders a badge, so the fonts, logos and ReportLab are known to be bundled.
          ./"$exe" selftest
          # getpass ignores piped input on Windows, so only the POSIX runners script a password.
          if [ "$RUNNER_OS" != "Windows" ]; then
            printf 'smoke-password\nsmoke-password\n' | ./"$exe" user add root --role admin > /dev/null
            # Without a license the program must refuse work (CI cannot hold the vendor's key).
            if printf 'smoke-password\n' | ./"$exe" ticket create --as root -n "Smoke Visitor" -t Visitor -f 2030-01-01T08:00 -u 2030-01-01T18:00 --usage one_time --tz Asia/Baku > refused.txt 2>&1; then
              echo "A ticket was created without a license"; exit 1
            fi
            grep -q "A valid license is required" refused.txt
            ./"$exe" license status | grep -q '"state": "none"'
            ./"$exe" license request-code | head -c 8 | grep -q '^ey'
            # The server, as installs run it: up, healthy, and signing in the admin above.
            ./"$exe" serve --dev --port 8765 > serve.log 2>&1 &
            server=$!
            for _ in $(seq 1 60); do
              curl -sf http://127.0.0.1:8765/api/health > /dev/null && break
              sleep 0.5
            done
            curl -sf http://127.0.0.1:8765/api/health | grep -q '"status":"ok"' || { cat serve.log; exit 1; }
            curl -sf -H 'Content-Type: application/json' -d '{"username":"root","password":"smoke-password"}' \
              http://127.0.0.1:8765/api/auth/login | grep -q csrf_token || { cat serve.log; exit 1; }
            kill "$server"
          fi
      - name: Fetch WinSW, the Windows service wrapper
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINSW_VERSION: v2.12.0
          # The hash of WinSW-x64.exe as first downloaded; a changed file fails the build.
          WINSW_SHA256: 05b82d46ad331cc16bdc00de5c6332c1ef818df8ceefcd49c726553209b3a0da
        run: |
          curl -fsSL -o WinSW-x64.exe "https://github.com/winsw/winsw/releases/download/$WINSW_VERSION/WinSW-x64.exe"
          echo "$WINSW_SHA256  WinSW-x64.exe" | sha256sum --check
      - name: Assemble the install bundle
        shell: bash
        run: |
          name="tiqr-$RUNNER_OS-$RUNNER_ARCH"
          exe=$(basename dist/tiqr*)
          mkdir -p "bundle/$name" release
          # Plain names inside, so the install scripts need not know the platform.
          cp "dist/$exe" "bundle/$name/$exe"
          cp tiqr_brand.jsonc packaging/bundle/INSTALL.txt "bundle/$name/"
          uv run python packaging/notices.py "bundle/$name/THIRD-PARTY-NOTICES.txt" --web apps/web
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp packaging/bundle/install.cmd "bundle/$name/"
            cp WinSW-x64.exe "bundle/$name/tiqr-service.exe"
            (cd bundle && 7z a -tzip "../release/$name.zip" "$name" > /dev/null)
          else
            cp packaging/bundle/install.sh "bundle/$name/"
            chmod +x "bundle/$name/install.sh" "bundle/$name/$exe"
            tar -C bundle -czf "release/$name.tar.gz" "$name"
          fi
      - name: Smoke test the bundle as a customer unpacks it
        shell: bash
        run: |
          name="tiqr-$RUNNER_OS-$RUNNER_ARCH"
          customer="$RUNNER_TEMP/customer"
          mkdir "$customer"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z x -o"$customer" "release/$name.zip" > /dev/null
          else
            tar -C "$customer" -xzf "release/$name.tar.gz"
          fi
          cd "$customer/$name"
          for file in INSTALL.txt THIRD-PARTY-NOTICES.txt tiqr_brand.jsonc; do test -s "$file"; done
          if [ "$RUNNER_OS" = "Windows" ]; then test -f install.cmd; test -f tiqr-service.exe; else test -x install.sh; fi
          exe=$(ls tiqr tiqr.exe 2>/dev/null | head -1)
          # The service and firewall steps need a real host; everything else runs as installed.
          ./"$exe" install --no-service --no-firewall --host 127.0.0.1 --port 8766 > install.log
          cat install.log
          grep -q "activate a license" install.log
          grep -q "tiqr license activate" install.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/prod'
        with:
          name: tiqr-${{ runner.os }}-${{ runner.arch }}
          path: release/*
          retention-days: 7

  release:
    # Tags only; builds from other refs, such as prod, don't publish a release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tiqr-*
          path: release
          merge-multiple: true
      - name: Check the tag matches the package version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Publish the executables with checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release && sha256sum tiqr-* > SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
          fi
