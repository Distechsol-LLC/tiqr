commit-msg:
  commands:
    commitizen:
      run: uv run cz check --commit-msg-file {1}
pre-commit:
  piped: true
  commands:
    lint:
      glob: "*.py"
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true
    format:
      glob: "*.py"
      run: uv run ruff format {staged_files}
      stage_fixed: true
    typecheck:
      glob: "*.py"
      run: uv run pyright
pre-push:
  parallel: true
  commands:
    cover:
      run: uv run pytest
